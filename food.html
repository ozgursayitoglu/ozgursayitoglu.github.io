 <script>
    // Sayfadaki tüm görsellere sağ tık yapıldığında olayı anında keser ve engeller
    document.addEventListener('contextmenu', function(e) {
        if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO' || e.target.closest('.lb-image')) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
    }, true);
